about_content: | # this will include new lines to allow paragraphs
  Systems & Infrastructure Architect / Platform Engineer with a strong background in backend systems, Kubernetes, DevOps, CI/CD, observability, automation, and reliability. I bring clarity to complex technical systems by designing maintainable architecture, improving delivery workflows, and strengthening production operations.

  I work best where ownership, clear context, thoughtful engineering, and sustainable delivery matter. My strongest contributions are platform work, backend architecture, automation, observability, reliability improvements, and technical review. I prefer calm collaboration, well-understood priorities, and sustainable operations over permanently reactive delivery.

  Outside work I enjoy chess, rock climbing, running, and hiking. These interests reflect the same qualities I value professionally: patience, focus, good judgement, and steady progress.

