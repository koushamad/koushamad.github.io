# Header / Executive Summary
about_title: Executive Summary
about_profile_image: images/1629721583450.jpg
about_content: |
  Systems & Infrastructure / Platform Engineer with a backend engineering background. I build and operate production platforms: Kubernetes-based infrastructure, CI/CD and workflow systems, and the developer tooling teams use to ship and run their services. My work covers infrastructure automation, observability, reliability, and distributed systems, with a focus on building platforms that are secure, resilient, and straightforward to operate.

  I take ownership of the systems I work on, from design and implementation through production operation and ongoing improvement. I enjoy hard technical problems and the architectural decisions that come with them, and I build tools that let engineering teams work independently. I hold a high bar for engineering quality and for systems that remain reliable and maintainable as they grow.

content:
  - title: Core Expertise
    layout: list
    content:
      - layout: left
        title: Platform Engineering & Developer Tooling
        sub_title: Internal platforms, CLIs, self-service workflows, secure execution
        description: |
          • Go-based platform tooling, including CLIs and plugin SDKs, with plugin management and access-controlled execution on Linux.

          • Workflow automation with Argo Workflows, Argo Events, and Temporal, and self-service tooling that lets teams operate independently.

      - layout: left
        title: Kubernetes & Application Delivery
        sub_title: Kubernetes infrastructure, GitOps, progressive delivery, CI/CD
        description: |
          • Kubernetes-based production infrastructure and application delivery with Helm, Argo CD for GitOps, and Argo Rollouts for progressive delivery in private cloud environments.

          • CI/CD with GitLab CI and Jenkins, deployment and merge-request automation, artifact workflows, and release guardrails.

      - layout: left
        title: Infrastructure as Code & Secrets
        sub_title: Provisioning, secrets management, service discovery
        description: |
          • Terraform, HashiCorp Vault, and HashiCorp Consul used alongside Kubernetes to provision infrastructure, manage secrets, and register services.

      - layout: left
        title: High Availability & Reliability
        sub_title: Resilient infrastructure, rollout safety, operational readiness
        description: |
          • Highly available backend systems across multiple data centres, with request routing, workload distribution, and failover that keep them operating under heavy load and through data-centre loss.

          • Deployment hardening, safe rollout patterns, readiness checks, and the operational groundwork that lets production changes ship with confidence.

      - layout: left
        title: Observability & Production Operations
        sub_title: Metrics, monitoring, debugging, incident investigation
        description: |
          • Prometheus and Grafana, metrics, logs, dashboards, and post-deployment feedback loops for production systems.

          • Investigating and resolving production issues across application, infrastructure, pipeline, and database layers.

      - layout: left
        title: Backend & Distributed Systems
        sub_title: Go services, APIs, distributed systems, messaging
        description: |
          • Backend services, APIs, workers, CLIs, service boundaries, integration layers, and data flows, with particular strength in Go.

          • Practical experience with messaging and data systems such as Redis, RabbitMQ, Kafka, NATS, MySQL, PostgreSQL, Cassandra, ClickHouse, Elasticsearch, and MongoDB.

      - layout: left
        title: Architecture & Technical Leadership
        sub_title: System design, technical decisions, standards
        description: |
          • Architecture and service-boundary design, platform decisions, engineering standards, code review, and mentoring.

          • Career progression from backend engineer to team lead, head of development, and infrastructure/platform engineer, with growing responsibility for system design and production systems.

  - title: Professional Experience
    layout: list
    content:
      - layout: left
        title: Adyen
        link: https://adyen.com/
        link_text: adyen.com
        sub_title: Infrastructure Engineer — CI/CD & Platform
        caption: Amsterdam, Netherlands · Jul 2023 — Present
        quote: Developer platforms, highly available backend architecture, multi-data-centre workflow orchestration, and self-service automation for a large-scale payments platform.
        description: |
          • Designed and built adyencli in Go, the CLI of a plugin management platform: teams develop plugins with Adyen-provided SDKs in four programming languages, submit them to be built and distributed through Adyen's package-management infrastructure, and the platform manages their lifecycle and controlled execution in Linux environments.

          • Built access control and controlled, secure plugin execution into the platform, and worked on its backend services and supporting infrastructure on Kubernetes, Helm, Argo CD, HashiCorp Vault, and HashiCorp Consul.

          • Designed the backend architecture of a separate highly available system distributed across four geographically separated data centres, routing requests to suitable, fast-responding services, with the architecture built to handle heavy workloads and keep operating when one or more data centres become unavailable.

          • Built a solution for operating Argo Workflows across multiple Kubernetes clusters and data centres, including the workflow controllers and their supporting database and state infrastructure, with execution responsibility coordinated across data centres that all had access to the workflow workload.

          • Used Kubernetes Leader Election as part of determining which controller owned a workflow's execution. Workflow and step state were recorded in the database, so when a lost node left a step marked Failed and ownership moved to another controller, the new owner retried that step from the recorded state and the workflow continued from there instead of restarting; surviving data centres took over when a data centre failed.

          • Contributed to a modular, self-service automation platform in Python: teams configure repository-specific automation by writing Gherkin scenarios that invoke reusable modules, instead of implementing each workflow themselves. It uses NATS as its event and message infrastructure and provides detailed Prometheus and Grafana monitoring of automation runs, down to individual merge requests and their pipeline executions.

          • Across this work, used Jenkins and GitLab CI for CI/CD pipelines, Argo CD and Argo Rollouts for deployment and progressive delivery, Argo Events for event-driven automation, and Temporal for workflow orchestration.

          • Used Terraform for infrastructure provisioning, Puppet for configuration management, HashiCorp Vault for secrets management, and HashiCorp Consul for service discovery, and worked with Flannel networking and service mesh technology in K3s environments.

          **Tech stack:** Go · Python · Gherkin · Kubernetes · K3s · Helm · Argo CD · Argo Workflows · Argo Events · Argo Rollouts · Temporal · Jenkins · GitLab CI · Terraform · Puppet · HashiCorp Vault · HashiCorp Consul · Flannel · NATS · Redis · Prometheus · Grafana · Linux

