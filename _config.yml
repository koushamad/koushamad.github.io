          • Built CI/CD checks for SEO and performance testing, so every release was validated the same way.

          • Tracked down application and database bottlenecks and turned what we found into concrete fixes.

          **Tech stack:** AWS · S3 · SNS · SQS · RDS · PHP · Laravel · Go · MySQL · Elasticsearch · Redis · TDD

