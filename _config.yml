  - title: Professional Experience
    layout: list
    content:
      - layout: left
        title: Adyen
        link: https://adyen.com/
        link_text: adyen.com
        sub_title: Infrastructure Engineer, CI/CD & Platform
        caption: Amsterdam, Netherlands · Jul 2023 to Present
        quote: Platform engineering, internal developer tooling, workflow automation, and highly available services deployed across four geographically distributed data centres.
        description: |
          • **Designed and built adyencli in Go**, Adyen's CLI and plugin management platform. It enables engineering teams to develop plugins using SDKs provided by AdyenCLI for four programming languages over gRPC, submit plugins for building and distribution, and manage their lifecycle, access controls, and secure execution on Linux and macOS.

          • **Designed the backend architecture of a highly available system deployed across four geographically distributed data centres.** It routes requests to responsive services, supports heavy workloads, and is designed to remain operational when one or more data centres become unavailable.

          • **Built a highly available, multi cluster execution and recovery solution for Argo Workflows.** Workflows can be taken over by another available cluster when their execution owner fails or comes under resource pressure. Persisted workflow state and retry handling enable recovery from failed steps without restarting the entire workflow.

          • **Contributed to a modular, self service automation platform built in Python and integrated into the HA environment.** Engineering teams define repository specific automation through Gherkin scenarios and reusable modules. The platform uses NATS, with Prometheus and Grafana monitoring down to individual merge requests and their associated pipeline executions.

          **Tech stack:** Go · Python · gRPC · Gherkin · Kubernetes · Helm · Argo CD · Argo Workflows · Argo Events · Argo Rollouts · Temporal · Jenkins · GitLab CI · Terraform · Puppet · HashiCorp Vault · HashiCorp Consul · Cilium · Calico · NATS · Redis · Prometheus · Grafana · Linux

