        title: Platform Engineering & Developer Tooling
        description: |
          • Platform tools and CLIs written in Go, plugin management and secure plugin execution, reusable automation, and self service workflows for engineering teams.

      - layout: left
        title: Kubernetes & Application Delivery
        description: |
          • Kubernetes and K3s infrastructure, Helm, GitOps with Argo CD, progressive delivery with Argo Rollouts, and CI/CD pipelines in GitLab CI and Jenkins.

      - layout: left
        title: Infrastructure as Code & Secrets
        description: |
          • Terraform for provisioning, Puppet for configuration management, HashiCorp Vault for secrets and HashiCorp Consul for service discovery.

      - layout: left
