  - title: Selected Projects
    layout: list
    content:
      - layout: left
        title: Pepper.com Platform Work
        caption: Scalable image processing and marketplace microservices · Remote / Berlin
        quote: Scalable Go image processing, deterministic request routing, and marketplace microservices for a high-volume deal-community platform.
        description: |
          • Built a Go-based image-processing service capable of processing around **5,000 new images per minute**, generating multiple resized variants for delivery across the platform.

          • Implemented deterministic request routing for image-resizing workloads. Cloudflare middleware derived a routing value from each image ID and the configured scaling limit, added it to a request header, and enabled the load-balancing layer to route requests to Kubernetes pods based on that value. This kept requests for a given image consistently routed to one service under the same routing configuration.

          • Prevented concurrent duplicate resize requests for the same image from triggering redundant processing. A singleflight-style request-coalescing mechanism allowed overlapping requests to share work already in progress.

          • Developed GraphQL flows for deal submission, product listings, and product details, and contributed to image-service performance, near-cache behaviour, load balancing, and microservice security reviews.

          **Tech stack:** Go · Kubernetes · Cloudflare · GraphQL · AWS · SQS · SNS · RDS · S3 · ELB · Elasticsearch · Redis · TDD

