  - title: Selected Projects
    layout: list
    content:
      - layout: left
        title: Pepper.com Platform Work
        caption: Scalable image processing and marketplace microservices · Remote / Berlin
        quote: Go image processing at scale, deterministic request routing and marketplace microservices for a high volume deal community platform.
        description: |
          • Built an image processing service in Go that handled around **5,000 new images per minute**, generating several resized variants of each image for delivery across the platform.

          • Implemented deterministic request routing for image resizing. Cloudflare middleware derived a routing value from each image ID and the configured scaling limit and added it to a request header. The load balancing layer used that value to route requests to Kubernetes pods, so requests for a given image kept reaching the same service as long as the routing configuration stayed the same.

          • Stopped concurrent resize requests for the same image from triggering duplicate processing. A singleflight style request coalescing mechanism let overlapping requests share the work already in progress.

          • Developed GraphQL flows for deal submission, product listings and product details. Also worked on image service performance, near cache behaviour, load balancing and security reviews of the microservices.

          **Tech stack:** Go · Kubernetes · Cloudflare · GraphQL · AWS · SQS · SNS · RDS · S3 · ELB · Elasticsearch · Redis · TDD

